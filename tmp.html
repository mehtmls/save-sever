<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>庆祝大不发巅群回归</title>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: radial-gradient(circle at center, #1a0000, #000);
        overflow: hidden;
        font-family: 'Microsoft YaHei', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
        z-index: 10;
        position: relative;
    }

    h1 {
        font-size: 4rem;
        color: #ffd700;
        text-shadow: 0 0 20px #ff4500, 0 0 40px #ff0000;
        animation: glow 1.5s infinite alternate;
        margin-bottom: 30px;
    }

    #countdown {
        font-size: 5rem;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 15px #ff0066, 0 0 30px #ff3300;
        animation: pulse 1s infinite;
    }

    @keyframes glow {
        from { text-shadow: 0 0 20px #ff4500, 0 0 40px #ff0000; }
        to { text-shadow: 0 0 40px #ffcc00, 0 0 80px #ff6600; }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    .particles {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    .particle {
        position: absolute;
        width: 6px; height: 6px;
        background: #ffcc00;
        border-radius: 50%;
        animation: float 4s infinite linear;
        opacity: 0.8;
    }

    @keyframes float {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
    }

    .firework {
        position: fixed;
        width: 10px; height: 10px;
        background: radial-gradient(circle, #ff0, transparent);
        border-radius: 50%;
        animation: explode 1s ease-out forwards;
        z-index: 5;
    }

    @keyframes explode {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(30); opacity: 0; }
    }

    .final-stage {
        animation: crazyFlash 0.3s infinite alternate !important;
    }

    @keyframes crazyFlash {
        from { background: #000; }
        to { background: #ff0044; }
    }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
    <h1>🎉 庆祝大不发巅群回归 🎉</h1>
    <div id="countdown">载入中...</div>
</div>

<script>
    const targetDate = new Date('2026-07-28T18:00:00').getTime();
    const countdownEl = document.getElementById('countdown');
    const particlesContainer = document.getElementById('particles');

    function createParticle() {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.background = `hsl(${Math.random()*60+10}, 100%, 60%)`;
        p.style.animationDuration = (Math.random() * 3 + 2) + 's';
        particlesContainer.appendChild(p);
        setTimeout(() => p.remove(), 5000);
    }

    function createFirework() {
        const f = document.createElement('div');
        f.className = 'firework';
        f.style.left = Math.random() * 100 + 'vw';
        f.style.top = Math.random() * 100 + 'vh';
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 1000);
    }

    setInterval(() => {
        for (let i = 0; i < 5; i++) createParticle();
    }, 300);

    function updateCountdown() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff <= 0) {
            document.body.classList.add('final-stage');
            countdownEl.innerHTML = '🔥 群已回归！狂欢开始！🔥';
            for (let i = 0; i < 30; i++) createFirework();
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        countdownEl.innerHTML = `${days}天 ${hours}时 ${minutes}分 ${seconds}秒`;

        if (diff < 86400000) {
            for (let i = 0; i < 10; i++) createFirework();
            countdownEl.style.fontSize = '6rem';
        }
        if (diff < 3600000) {
            document.body.style.animation = 'crazyFlash 0.5s infinite alternate';
        }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
